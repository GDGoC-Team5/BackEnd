# CI: develop / main 으로 가는 PR 과 push 마다 테스트 (H2 메모리 DB 사용, 실제 DB 불필요)
# CD: main 에 push(= PR 머지) 되면 EC2 에 SSH 접속 → 최신 main 받아서 이미지 빌드 → studyhub 컨테이너 교체
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions)
#   EC2_HOST     : EC2 퍼블릭 IP 또는 도메인
#   EC2_USER     : SSH 사용자 (Ubuntu AMI 면 ubuntu, Amazon Linux 면 ec2-user)
#   EC2_SSH_KEY  : .pem 키 파일 내용 전체
#   EC2_APP_DIR  : EC2 에서 이 레포를 clone 해 둔 경로 (예: /home/ubuntu/BackEnd)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            # 운영 서버는 compose 가 아니라 단일 컨테이너(studyhub)로 실행한다.
            # DB 는 외부에 있고, 환경변수는 서버의 .env 에서 읽는다 (.env 는 git 에 없어서 그대로 유지됨).
            run_app() {
              docker run -d --name studyhub --restart unless-stopped \
                -p 127.0.0.1:8080:8080 --env-file .env "$1"
            }

            # 롤백용으로 현재 이미지를 :prev 로 보관
            docker image inspect studyhub-app:latest >/dev/null 2>&1 \
              && docker tag studyhub-app:latest studyhub-app:prev

            # 빌드하는 동안은 기존 컨테이너가 계속 서비스한다
            docker build -t studyhub-app:latest .

            docker stop studyhub || true
            docker rm studyhub || true
            run_app studyhub-app:latest

            # 앱이 뜨는지 확인 (최대 약 90초 대기). 실패하면 이전 이미지로 되돌린다.
            for i in $(seq 1 18); do
              if curl -s -o /dev/null http://127.0.0.1:8080; then
                echo "deploy ok"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "app did not start — rolling back"
            docker logs --tail=100 studyhub || true
            docker stop studyhub || true
            docker rm studyhub || true
            run_app studyhub-app:prev
            exit 1
