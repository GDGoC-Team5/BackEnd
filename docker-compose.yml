# 로컬 개발용 compose. 값은 같은 폴더의 .env 에서 읽는다 (.env.example 참고).
#   전체 실행:   docker compose up -d --build
#   DB 만 실행:  docker compose up -d mysql   (앱은 IntelliJ 에서 실행)
#   종료:        docker compose down          (데이터까지 삭제: down -v)
services:
  mysql:
    image: mysql:8.4
    container_name: studyhub-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트에 이미 MySQL(3306)이 있어도 충돌하지 않도록 기본 3307 사용
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: studyhub-app
    depends_on:
      mysql:
        condition: service_healthy   # DB 가 실제로 접속 가능해진 뒤에 앱 시작
    environment:
      # 컨테이너 안에서 localhost 는 자기 자신이므로, DB 주소를 서비스 이름(mysql)으로 덮어쓴다
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"

volumes:
  mysql-data:
