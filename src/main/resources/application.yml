server:
  # Nginx 뒤에서 X-Forwarded-* 헤더로 HTTPS 를 인식
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: studyhub
  config:
    # 프로젝트 루트의 .env 를 읽어온다 (없으면 무시)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    # Swagger 가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 자동 전송 (로그인 후 POST/PATCH/DELETE 테스트용)
    csrf:
      enabled: true
